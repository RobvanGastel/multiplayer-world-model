# MultiWrapperWorldModel config
n_players: 2

wm_config:
  actions:
    valid_keys: [w, a, s, d]
    source_fps: 60
    # Must equal the rate of the action stream the loaders deliver: nothing resamples actions (the
    # dataset hands over one action per recorded 60fps frame). target_fps 30 made
    # action_temporal_downsampling 1 instead of 2, so each latent (2 frames) read one action from
    # ~half its own time index -- stale, uninformative actions the model learned to ignore.
    # 60 gives 2 actions per latent, latent j <- actions 2j-1, 2j (the transitions into its frames).
    target_fps: 60

  video:
    height: 160
    width: 128
    channels: 3
    timesteps: 40
    fps: 60

  # The codec2 snapshot (~step 67k) that the world model was trained with. Its latent mean/std are
  # stored in the codec checkpoint, so the world model only works with this exact codec.
  codec_checkpoint: runs/codec.pt
  # Optional override of the codec latent mean/std; normally read from the codec checkpoint.
  latent_mean_std: null

  causal: true
  activation_checkpointing: true

  # PSD-M self-distillation: progressive self-distillation with midpoint targets; see "How to build a
  # consistency model" (https://arxiv.org/abs/2505.18825) and the equivalent scheme in "One Step
  # Diffusion via Shortcut Models" (https://arxiv.org/abs/2410.12557).
  # Fraction of training steps that add the PSD-M loss (0 disables it).
  psd_loss_prob: 0.1

  # Condition each denoising step on the clean latents of the previous frames (avoids the
  # train/inference mismatch in diffusion forcing).
  use_clean_past: true

  # Per-player action dropout: a dropped player's keys are replaced by learned "unknown" tokens.
  dropout_action_prob: 0.1

  patch_size: 1
  attention_gating: true

  n_context_frames: 39  # only used during inference

  # Same small transformer as configs/world_model/latent_world_model.yml -- hidden_dim/n_head/
  # n_layers are unaffected by tiling (only video.height is multiplied by n_players internally).
  hidden_dim: 384
  n_head: 8
  n_kv_head: null
  n_layers: 10
  time_attention_every: 1
